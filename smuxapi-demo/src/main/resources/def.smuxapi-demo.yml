#------------------------------------------------------------------------
# SYS PROPERTIES
#------------------------------------------------------------------------
# 서버 포트 설정 (JAR 실행 시 적용, 설정하지 않으면 기본값 8080 사용)
# SERVER_PORT: 8080

OPENAI_ASSIST_ID: your assistant id
OPENAI_API_KEY: your openai api key
OPENAI_MODEL: gpt-4.1
GEMINI_MODEL: gemini-2.5-flash
GEMINI_API_KEY: your gemini api key

# Anthropic Claude (https://console.anthropic.com 에서 발급, sk-ant-... 형식)
# CLAUDE_API_VERSION 은 선택사항 — 미지정 시 라이브러리 기본값 사용 (예: 2023-06-01)
CLAUDE_API_KEY: your claude api key
CLAUDE_MODEL: claude-sonnet-4-6
CLAUDE_API_VERSION: ""

#------------------------------------------------------------------------
# SCENARIO COLLECTION (v0.10.0+)
#------------------------------------------------------------------------
# Full Scenario Test Case 작성을 위한 대화 데이터 수집. 기본 비활성.
# true 로 변경 후 smuxapi-demo 실행하면 매 대화 턴의 user_prompt / api_prompt /
# ui_info / res_msg / action_queue 가 JSON 으로 저장된다.
smuxapi:
  scenario:
    collect-enabled: false
    output-path: "./scenarios/"
    file-prefix: "test-scenario"
